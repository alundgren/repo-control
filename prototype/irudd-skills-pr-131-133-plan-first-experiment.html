<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan-first PR review experiment</title>
    <style>
      :root { --bg:#F2EADE; --surface:#EADFCD; --raised:#E0D2BD; --line:#C1AF9A; --field:#F9F6F0; --text:#604939; --muted:#66574D; --accent:#784F26; --link:#3D5D71; --ok:#3D6034; --warn:#7E5220; --danger:#8F3A2D; --sans:system-ui,sans-serif; --mono:ui-monospace,monospace; }
      * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.55 var(--sans); } button { font:inherit; color:inherit; } button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
      .shell { display:grid; grid-template-columns:17rem minmax(0,1fr); min-height:100vh; } aside { padding:1.5rem 1rem; border-right:1px solid var(--line); } main { min-width:0; padding:2rem clamp(1rem,4vw,3rem) 4rem; max-width:96rem; }
      h1,h2,h3,p { margin-top:0; } h1 { margin-bottom:.25rem; font-size:clamp(1.8rem,4vw,2.5rem); line-height:1.1; letter-spacing:-.015em; } h2 { margin:0; font-size:1.14rem; } .eyebrow,.state,.label { color:var(--muted); font:500 11px/1.4 var(--mono); letter-spacing:.07em; text-transform:uppercase; }.intro { color:var(--muted); max-width:67ch; font-size:.88rem; }
      nav { display:grid; gap:.3rem; margin-top:1.8rem; } nav button { display:grid; grid-template-columns:3rem minmax(0,1fr); gap:.45rem; width:100%; padding:.65rem; border:0; border-radius:.45rem; background:transparent; cursor:pointer; text-align:left; } nav button:hover,nav button[aria-current="page"] { background:var(--raised); } nav button[aria-current="page"] { box-shadow:inset 3px 0 var(--link); } .num { color:var(--muted); font:12px var(--mono); } .title { overflow:hidden; font-size:.84rem; font-weight:500; text-overflow:ellipsis; white-space:nowrap; }.rail-note { margin:2rem .6rem 0; color:var(--muted); font-size:.76rem; }
      .header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:1rem; align-items:baseline; } .pager { display:flex; gap:.5rem; margin:1.5rem 0; } .pager button { padding:.45rem .65rem; border:1px solid var(--line); border-radius:.45rem; background:var(--field); color:var(--link); cursor:pointer; } .pager button:disabled { opacity:.6; cursor:default; }
      .verdict { max-width:78rem; margin:1rem 0 2rem; padding:1rem; border-left:4px solid var(--danger); background:var(--surface); }.verdict b { display:block; margin-bottom:.2rem; font-size:.94rem; }.verdict p { max-width:72ch; margin:0; }.variants { display:grid; gap:2.25rem; max-width:78rem; }.variant { padding-top:1rem; border-top:1px solid var(--line); }.variant-head { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-bottom:.8rem; }.variant-head p { margin:0; color:var(--muted); font-size:.77rem; }
      .plan { max-width:72ch; padding:1rem; border:1px solid var(--line); border-radius:.55rem; background:var(--field); }.plan h3 { margin-bottom:.55rem; }.plan ol { margin:0; padding-left:1.2rem; }.plan li { margin:.35rem 0; }.plan .test { margin:.8rem 0 0; padding-top:.7rem; border-top:1px dashed var(--line); color:var(--warn); font-size:.88rem; }
      .split { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }.split section { padding:1rem; border-top:3px solid var(--line); background:var(--field); }.split section:first-child { border-color:var(--ok); }.split section:last-child { border-color:var(--danger); }.split h3 { margin-bottom:.5rem; }.split ul { margin:0; padding-left:1.2rem; }.split li { margin:.35rem 0; font-size:.88rem; }.kill { color:var(--danger); }
      .sieve { display:grid; grid-template-columns:9rem minmax(0,1fr); border-top:1px solid var(--line); }.sieve b,.sieve span { padding:.7rem .5rem; border-bottom:1px solid var(--line); }.sieve b { color:var(--muted); font:500 11px/1.4 var(--mono); letter-spacing:.05em; }.sieve .not-proven { color:var(--warn); }.sieve .local-only { color:var(--muted); }
      .review { padding:1.1rem; border:1px solid var(--text); background:var(--field); }.review h3 { font-size:1.08rem; }.review p { max-width:70ch; }.review .ask { margin:0; padding-top:.7rem; border-top:1px dashed var(--line); color:var(--danger); font-weight:600; }
      @media (max-width:760px) { .shell{display:block} aside{border-right:0;border-bottom:1px solid var(--line)} nav{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:1rem}.rail-note{display:none}.split{grid-template-columns:1fr}.sieve{grid-template-columns:6.5rem minmax(0,1fr)} }
    </style>
  </head>
  <body>
    <div class="shell"><aside><p class="eyebrow">Local experiment two</p><h2>Plan before code</h2><p class="intro">A review should reject code without a solution shape. Tests do not turn extra machinery into a design.</p><nav id="index"></nav><p class="rail-note">Both reviews use only the PR and its base revision. This file stays local.</p></aside><main id="app"></main></div>
    <script>
      const prs = [
        {n:133,state:"Open draft",title:"Add Fleet service socket foundation",size:"15 files · +1,193/−422",headline:"This is not ready to review as a change. It is an unfinished lifecycle design written as production code.",summary:"The PR introduces a daemon, socket RPC, a service launcher, generated service definitions, copied artifact code, and lifecycle commands before it settles who owns configuration and how enable, disable, and update work.",plan:["Resolve one immutable service configuration from the checked-in local config.","Start one daemon from that configuration and give the local CLI a small socket protocol.","Define enable, disable, restart, and update states before writing supervisor commands."],keep:["A daemon-owned local socket for mutation.","A short CLI that sends status, sync, or rollback to it.","Socket ownership and permissions checks."],defer:["Service lifecycle commands until their state contract exists.","Environment-variable data-root precedence.","Copied artifact and launcher changes unrelated to a proven service start path.","Update restart logic before a drain and readiness contract."],proved:"The socket unit test checks permissions and refuses a live socket.",local:"Tests prove individual socket mechanics. They do not prove service startup, safe disable, update draining, or one stable data root.",missing:"The PR itself lists lifecycle blockers. Those are the missing solution plan.",ask:"Stop here. Write the service lifecycle contract and one source of truth for paths. Then make a small daemon-and-socket slice."},
        {n:131,state:"Merged",title:"Converge nodes on verified Git main",size:"15 files · +3,494/−240",headline:"The useful idea is small. The implementation turns it into a large, multi-language control system without first proving that each layer is needed.",summary:"The base architecture already gave the convergence sequence. This PR adds a large state machine, an embedded Python lock helper, subprocess control, an hourly scheduler, generated artifact code, and many failure paths around that sequence.",plan:["Fetch the owned clone and verify the candidate is on main and valid for this node.","Reset that clone, run the installer, then run its audit.","Record one outcome only after the audit says the managed outputs match."],keep:["The pre-reset membership and main-ancestry checks.","A dedicated owned clone, never a developer checkout.","Installer audit as the proof of convergence."],defer:["The embedded python3 advisory-lock helper until its runtime contract is explicit.","State transitions that do not change an observable decision.","Scheduler and rollback policy until the direct convergence path is short and trusted.","Generated artifact churn in the same review as the new design."],proved:"Tests create Git fixtures and show individual convergence outcomes.",local:"Those tests exercise mechanics. They do not establish that the state machine and helper process are the simplest correct design.",missing:"The PR never makes a case for why the direct three-step plan needs this much machinery.",ask:"Cut back to the verified convergence path. Treat locking and scheduling as separate, justified additions, not prerequisites for the first working version."}
      ];
      const esc = (s) => String(s).replace(/[&<>\"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
      const current = () => prs.find((p) => p.n === Number(location.hash.slice(4))) || prs[0];
      const set = (n) => { location.hash = `pr-${n}`; };
      const list = (items) => `<ul>${items.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>`;
      function plan(p) { return `<section class="variant"><div class="variant-head"><h2>1 · Smallest plan</h2><p>Could this have been planned before coding?</p></div><article class="plan"><h3>The whole job, before implementation</h3><ol>${p.plan.map((item) => `<li>${esc(item)}</li>`).join("")}</ol><p class="test">Test: if the PR's core cannot be explained this simply, it needs a plan before more code.</p></article></section>`; }
      function keepKill(p) { return `<section class="variant"><div class="variant-head"><h2>2 · Keep or defer</h2><p>Only retain code that earns its place</p></div><div class="split"><section><h3>Keep in the first slice</h3>${list(p.keep)}</section><section><h3 class="kill">Defer until justified</h3>${list(p.defer)}</section></div></section>`; }
      function sieve(p) { return `<section class="variant"><div class="variant-head"><h2>3 · Evidence sieve</h2><p>Tests prove local facts, not a whole design</p></div><div class="sieve"><b>PROVED</b><span>${esc(p.proved)}</span><b class="local-only">LOCAL ONLY</b><span class="local-only">${esc(p.local)}</span><b class="not-proven">NOT PROVED</b><span class="not-proven">${esc(p.missing)}</span></div></section>`; }
      function review(p) { return `<section class="variant"><div class="variant-head"><h2>4 · Straight review</h2><p>One conclusion, no grading vocabulary</p></div><article class="review"><h3>${esc(p.headline)}</h3><p>${esc(p.summary)}</p><p class="ask">${esc(p.ask)}</p></article></section>`; }
      function render() { const p=current(), i=prs.indexOf(p); document.querySelector("#app").innerHTML = `<div class="header"><div><p class="eyebrow">Historical PR review</p><h1>PR #${p.n}: ${esc(p.title)}</h1><p class="intro">Four ways to ask whether there is a real solution here, before debating whether the code fits.</p></div><p class="state">${esc(p.state)} · ${esc(p.size)}</p></div><div class="pager"><button data-next ${i===0?"disabled":""}>Newer</button><button data-previous ${i===prs.length-1?"disabled":""}>Older</button></div><article class="verdict"><b>${esc(p.headline)}</b><p>${esc(p.summary)}</p></article><div class="variants">${plan(p)}${keepKill(p)}${sieve(p)}${review(p)}</div>`; document.querySelector("[data-next]")?.addEventListener("click",()=>set(prs[i-1].n)); document.querySelector("[data-previous]")?.addEventListener("click",()=>set(prs[i+1].n)); document.querySelector("#index").innerHTML=prs.map((x)=>`<button data-pr="${x.n}" aria-current="${x.n===p.n?"page":"false"}"><span class="num">#${x.n}</span><span class="title">${esc(x.title)}</span></button>`).join(""); document.querySelectorAll("[data-pr]").forEach((button)=>button.addEventListener("click",()=>set(Number(button.dataset.pr)))); }
      addEventListener("hashchange",render); if (!location.hash) set(prs[0].n); render();
    </script>
  </body>
</html>
