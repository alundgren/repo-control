<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet PR degradation experiment</title>
    <style>
      :root { --bg:#F2EADE; --surface:#EADFCD; --raised:#E0D2BD; --line:#C1AF9A; --field:#F9F6F0; --text:#604939; --muted:#66574D; --accent:#784F26; --link:#3D5D71; --ok:#3D6034; --warn:#7E5220; --danger:#8F3A2D; --sans:system-ui,sans-serif; --mono:ui-monospace,monospace; }
      * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.55 var(--sans); } button { font:inherit; color:inherit; } button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
      .shell { display:grid; grid-template-columns:16rem minmax(0,1fr); min-height:100vh; } aside { padding:1.5rem 1rem; border-right:1px solid var(--line); } main { min-width:0; padding:2rem clamp(1rem,4vw,3rem) 4rem; max-width:96rem; }
      h1,h2,h3,p { margin-top:0; } h1 { margin-bottom:.25rem; font-size:clamp(1.8rem,4vw,2.5rem); line-height:1.1; letter-spacing:-.015em; } h2 { margin:0; font-size:1.1rem; } .eyebrow,.state,.label { color:var(--muted); font:500 11px/1.4 var(--mono); letter-spacing:.07em; text-transform:uppercase; }.intro { color:var(--muted); max-width:65ch; font-size:.88rem; }
      nav { display:grid; gap:.3rem; margin-top:1.8rem; } nav button { display:grid; grid-template-columns:3rem minmax(0,1fr); gap:.45rem; width:100%; padding:.65rem; border:0; border-radius:.45rem; background:transparent; cursor:pointer; text-align:left; } nav button:hover,nav button[aria-current="page"] { background:var(--raised); } nav button[aria-current="page"] { box-shadow:inset 3px 0 var(--link); } .num { color:var(--muted); font:12px var(--mono); } .title { overflow:hidden; font-size:.84rem; font-weight:500; text-overflow:ellipsis; white-space:nowrap; }
      .header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:1rem; align-items:baseline; } .pager { display:flex; gap:.5rem; margin:1.5rem 0; } .pager button { padding:.45rem .65rem; border:1px solid var(--line); border-radius:.45rem; background:var(--field); color:var(--link); cursor:pointer; } .pager button:disabled { opacity:.6; cursor:default; }
      .facts { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1rem; padding:1rem 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); } .facts b { display:block; font-size:.84rem; } .facts span { color:var(--muted); font-size:.76rem; } .signal { margin:1.25rem 0 2rem; padding:.85rem 1rem; border-left:3px solid var(--warn); background:var(--surface); max-width:78rem; } .signal strong { display:block; margin-bottom:.15rem; }.signal p { margin:0; max-width:72ch; font-size:.9rem; }
      .variants { display:grid; gap:2.15rem; max-width:78rem; }.variant { padding-top:.9rem; border-top:1px solid var(--line); }.variant-head { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-bottom:.8rem; }.variant-head p { margin:0;color:var(--muted);font-size:.76rem; }.clean { margin:0;color:var(--ok);font-size:.9rem; }
      .map { display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:.5rem;}.node { min-height:5.5rem;padding:.7rem;border:1px solid var(--line);border-radius:.55rem;background:var(--field);}.node b{display:block;font-size:.84rem}.node small{display:block;margin-top:.25rem;color:var(--muted);font-size:.74rem;line-height:1.35}.node:last-child { border-color:var(--warn); background:var(--raised);}.arrow{color:var(--link);font:1.2rem var(--mono)}
      .sequence { display:grid;grid-template-columns:7rem 1.3rem minmax(0,1fr);gap:0 .7rem;}.who{padding:.35rem 0;color:var(--muted);font:500 11px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase}.line{position:relative;border-left:1px solid var(--line)}.line::before{content:"";position:absolute;left:-.27rem;top:.6rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--link)}.step{padding:.24rem 0 .6rem;font-size:.87rem}.step:last-child{color:var(--warn)}
      ul{margin:0;padding-left:1.2rem}li{margin:.35rem 0;max-width:74ch;font-size:.89rem}.redline,.ticket{padding:1rem;border:1px solid var(--line);background:var(--field)}.docket,.ticket-top{display:flex;justify-content:space-between;gap:1rem;align-items:center}.stamp{padding:.18rem .45rem;border:2px solid var(--warn);border-radius:.2rem;color:var(--warn);font:600 11px/1 var(--mono);letter-spacing:.08em;transform:rotate(-2deg)}.clause{margin:.8rem 0;font-size:1.02rem;max-width:63ch}.amendment{padding:.55rem 0;border-top:1px dashed var(--line);font-size:.87rem}del{text-decoration-color:var(--danger);text-decoration-thickness:2px}ins{margin-left:.35rem;color:var(--ok);text-decoration:none}.seals{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}.seal{padding:.35rem .45rem;border:1px solid var(--line);border-radius:.35rem;color:var(--muted);font:500 11px/1.35 var(--mono)}.proof{margin-top:.8rem;padding-top:.65rem;border-top:1px dashed var(--line);font-size:.76rem;color:var(--muted)}code{display:block;margin-top:.2rem;overflow-wrap:anywhere;color:var(--link);font:11px/1.45 var(--mono)}
      .punch{color:var(--warn);font:600 11px/1.4 var(--mono);letter-spacing:.06em}.claim{margin:.5rem 0 .8rem;font-size:1rem}.row{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.5rem;padding:.38rem 0;border-top:1px solid var(--line);font-size:.84rem}.row b{color:var(--muted);font:500 11px/1.4 var(--mono);letter-spacing:.05em}.inspection{margin:.75rem 0 0;color:var(--muted);font:11px/1.4 var(--mono);letter-spacing:.04em}.hold{margin:.75rem 0 0;padding-top:.6rem;border-top:2px dotted var(--line);color:var(--warn);font-size:.82rem}
      @media (max-width:760px){.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}nav{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:1rem}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.map{grid-template-columns:1fr;gap:.3rem}.arrow{transform:rotate(90deg);text-align:center}.node{min-height:auto}.sequence{grid-template-columns:5.5rem 1rem minmax(0,1fr)}}
    </style>
  </head>
  <body>
    <div class="shell"><aside><p class="eyebrow">Separate local experiment</p><h2>Fleet-manager PRs</h2><p class="intro">Same five views, limited to these two PRs. No later outcomes are used in either verdict.</p><nav id="index"></nav></aside><main id="app"></main></div>
    <script>
      const prs=[
        {n:133,state:"Open draft",title:"Add Fleet service socket foundation",size:"15 files · +1,193/−422",verdict:"SCAR",fit:"conflicted",pattern:"forks · service path authority",confidence:"high",claim:"A supervised daemon owns mutable node operations through a private Unix socket.",nodes:["Local configuration","service environment","daemon data root"],steps:[["Service definition","sets data-root environment"],["Path resolution","prefers service environment"],["Daemon","uses resulting root for socket and state"]],proof:{status:"PARTIAL",seam:"socket unit test",command:"pnpm --filter @fleet-manager/agent test",oracle:"socket permissions and active-socket refusal are checked"},signal:"The branch itself calls out the problem: service environment input can override the persisted data-root configuration. That creates two competing authorities for identity, state, socket, and installer-ledger location.",amendment:"<del>Environment selects the service root.</del><ins>Configuration selects one root; the service only receives that resolved value.</ins>"},
        {n:131,state:"Merged",title:"Converge nodes on verified Git main",size:"15 files · +3,494/−240",verdict:"BENT",fit:"mostly aligned",pattern:"earns with risk · external lock helper",confidence:"medium",claim:"A node verifies a main commit, applies the installer, and records convergence only after audit.",nodes:["verified Git main","convergence service","installer audit"],steps:[["Convergence","fetches and verifies target on main"],["Installation lock","serializes clone and managed-output mutation"],["Installer and audit","determine the recorded convergence result"]],proof:{status:"PARTIAL",seam:"temporary Git repository",command:"pnpm --filter @fleet-manager/agent test",oracle:"tests create repositories and assert verified convergence outcomes"},signal:"The core flow matches the documented architecture. The lock, however, launches an embedded `python3` helper. That makes Python a runtime prerequisite for the Node artifact without putting it in the node preflight or service contract.",amendment:"<del>The Node artifact silently requires python3 to mutate.</del><ins>Declare and verify the lock runtime, or keep the lock inside the stated Node contract.</ins>"}
      ];
      const esc=(s)=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); const current=()=>prs.find(p=>p.n===Number(location.hash.slice(4)))||prs[0]; const set=(n)=>location.hash=`pr-${n}`;
      function map(p){return `<section class="variant"><div class="variant-head"><h2>1 · Architecture map</h2><p>Where the pressure lands</p></div><div class="map">${p.nodes.map((x,i)=>`<div class="node"><b>${esc(x)}</b><small>${i===0?esc(p.claim):i===1?`Fit: ${esc(p.fit)}`:`Pattern: ${esc(p.pattern)}`}</small></div>${i<2?'<div class="arrow">→</div>':''}`).join('')}</div></section>`}
      function sequence(p){return `<section class="variant"><div class="variant-head"><h2>2 · Behaviour sequence</h2><p>What must happen in order</p></div><div class="sequence">${p.steps.map(([a,b])=>`<div class="who">${esc(a)}</div><div class="line"></div><div class="step">${esc(b)}</div>`).join('')}</div></section>`}
      function bullets(p){return `<section class="variant"><div class="variant-head"><h2>3 · Compact brief</h2><p>Minimal review output</p></div><ul><li><b>Day one:</b> ${esc(p.verdict.toLowerCase())}.</li><li><b>Fit:</b> ${esc(p.fit)}. ${esc(p.pattern)}.</li><li><b>Concern:</b> ${esc(p.signal)}</li><li><b>Agent proof:</b> ${esc(p.proof.status.toLowerCase())}. ${esc(p.proof.oracle)}.</li></ul></section>`}
      function redline(p){return `<section class="variant"><div class="variant-head"><h2>4 · Day-One Redline</h2><p>Sol variant: amended design contract</p></div><article class="redline"><div class="docket"><span class="label">PR #${p.n}</span><strong class="stamp">${esc(p.verdict)}</strong></div><p class="clause">${esc(p.claim)}</p><p class="amendment">${p.amendment}</p><div class="seals"><span class="seal"><b>FIT</b> ${esc(p.fit)}</span><span class="seal"><b>PATTERN</b> ${esc(p.pattern)}</span></div><div class="proof"><b>${esc(p.proof.status)}</b> · ${esc(p.proof.oracle)}<code>${esc(p.proof.command)}</code></div></article></section>`}
      function ticket(p){return `<section class="variant"><div class="variant-head"><h2>5 · Proof Ticket</h2><p>Sol variant: verification first</p></div><article class="ticket"><div class="ticket-top"><span class="label">PR #${p.n} · proof ticket</span><strong class="punch">${esc(p.proof.status)}</strong></div><p class="claim">"${esc(p.claim)}"</p><div class="row"><b>OBSERVE</b><span>${esc(p.proof.seam)}</span></div><div class="row"><b>RUN</b><code>${esc(p.proof.command)}</code></div><div class="row"><b>ACCEPT</b><span>${esc(p.proof.oracle)}</span></div><p class="inspection">DAY ONE · ${esc(p.verdict)} &nbsp; ARCHITECTURE · ${esc(p.fit).toUpperCase()} &nbsp; PRECEDENT · ${esc(p.pattern).toUpperCase()}</p><p class="hold">HOLD: ${esc(p.signal)}</p></article></section>`}
      function render(){const p=current(),i=prs.indexOf(p);document.querySelector('#app').innerHTML=`<div class="header"><div><p class="eyebrow">Historical review · base revision only</p><h1>PR #${p.n}: ${esc(p.title)}</h1><p class="intro">Five bounded prompt-and-presentation variants using the same PR evidence.</p></div><p class="state">${esc(p.state)} · ${esc(p.size)}</p></div><div class="pager"><button data-next ${i===0?'disabled':''}>Newer</button><button data-previous ${i===prs.length-1?'disabled':''}>Older</button></div><section class="facts"><div><b>${esc(p.verdict)}</b><span>day-one verdict</span></div><div><b>${esc(p.fit)}</b><span>architectural fit</span></div><div><b>${esc(p.pattern)}</b><span>new pattern</span></div><div><b>${esc(p.proof.status)}</b><span>agent proof</span></div></section><aside class="signal"><strong>Material concern</strong><p>${esc(p.signal)}</p></aside><div class="variants">${map(p)}${sequence(p)}${bullets(p)}${redline(p)}${ticket(p)}</div>`;document.querySelector('[data-next]')?.addEventListener('click',()=>set(prs[i-1].n));document.querySelector('[data-previous]')?.addEventListener('click',()=>set(prs[i+1].n));document.querySelector('#index').innerHTML=prs.map(x=>`<button data-pr="${x.n}" aria-current="${x.n===p.n?'page':'false'}"><span class="num">#${x.n}</span><span class="title">${esc(x.title)}</span></button>`).join('');document.querySelectorAll('[data-pr]').forEach(b=>b.addEventListener('click',()=>set(Number(b.dataset.pr))));}
      addEventListener('hashchange',render);if(!location.hash)set(prs[0].n);render();
    </script>
  </body>
</html>
